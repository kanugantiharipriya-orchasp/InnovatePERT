# Application Name and Port
spring.application.name=InnovatePertBackend
# server.port=8080
server.port=${SERVER.PORT}

# # Database Connection Details
# spring.datasource.url=jdbc:mysql://localhost:3306/innovatepert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# spring.mail.username=nageshnenavath39@gmail.com
# spring.mail.password=cjfg wakk dlbp upzl

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
# jwt.secret=InnovatePERTJwtSecretKey2026SecureProjectAuthKey
# jwt.expiration=86400000

jwt.secret=${SECRET_KEY}
jwt.expiration=${EXPIRE_TIME}

