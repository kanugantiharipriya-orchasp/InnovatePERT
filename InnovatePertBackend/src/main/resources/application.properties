# Application Name and Port
spring.application.name=InnovatePertBackend
server.port=8080

# --- Memory Optimizations for 500MB Container ---
# Reduce Tomcat threads from default 200 to 50 (saves up to 150MB thread stack memory)
server.tomcat.threads.max=50
# Reduce connection pool size to prevent excessive memory allocation per connection
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# ------------------------------------------------
#server.port=${PORT:8080}

# # Database Connection Details
