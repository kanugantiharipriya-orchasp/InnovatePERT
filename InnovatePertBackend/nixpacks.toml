[phases.setup]
aptPkgs = ["...", "fontconfig", "libfreetype6", "fonts-dejavu", "fonts-dejavu-core"]

[variables]
# Highly aggressive memory constraints for Railway Free Tier (500MB RAM)
# 1. -XX:+UseSerialGC: Uses the Serial Garbage Collector (lowest memory footprint)
# 2. -Xms128m -Xmx256m: Restricts Heap size
# 3. -XX:MaxMetaspaceSize=100m: Restricts Class metadata memory
# 4. -XX:ReservedCodeCacheSize=64m: Restricts JIT compiled code memory
# 5. -Xss512k: Reduces thread stack size
JAVA_TOOL_OPTIONS = "-Xms128m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=100m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:+UseContainerSupport"
# Optimize Maven build process to prevent OOM during build
MAVEN_OPTS = "-Xmx256m -XX:+UseSerialGC"
